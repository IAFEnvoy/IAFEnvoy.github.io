<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>16:10 图片合成器</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app">
    <h1>16:10 图片合成器</h1>
    <div class="controls">
      <input type="file" id="fileInput" accept="image/*">

      <fieldset class="mode-fieldset">
        <legend>背景模式</legend>
        <label><input type="radio" name="mode" id="modeBlur" value="blur" checked> 高斯模糊</label>
        <label><input type="radio" name="mode" id="modeSolid" value="solid"> 纯色填充</label>
      </fieldset>

      <div class="bg-options">
        <label><input type="checkbox" id="autoBg"> 自动取色作为背景</label>
        <label>背景颜色: <input type="color" id="bgColor" value="#FFFFFF" disabled></label>
      </div>

      <div class="side-colors">
        <label>左侧颜色: <input type="color" id="leftColor" value="#000000"></label>
        <label>右侧颜色: <input type="color" id="rightColor" value="#000000"></label>
      </div>

      <label for="blurRange">高斯模糊: <span id="blurValue">20</span> px</label>
      <input type="range" id="blurRange" min="0" max="200" value="20">
      <button id="generateBtn" disabled>生成预览</button>
      <button id="downloadBtn" disabled>下载图像</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="previewCanvas"></canvas>
    </div>
    <p class="notes">说明：纯前端将图片处理为16:10横向，背景使用拉伸并高斯模糊的备份图像。</p>
  </div>
  <script defer src="script.js"></script>
</body>

</html>
